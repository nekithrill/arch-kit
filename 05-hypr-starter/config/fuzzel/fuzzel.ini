# =============================================================================
# hypr-starter/config/fuzzel/fuzzel.ini
# Minimalistic application launcher configuration
# =============================================================================

[main]
font=JetBrainsMono Nerd Font:size=11
fields=name,generic,comment,exec
terminal=kitty -e
prompt=" Run: "
layer=top
width=40
horizontal-pad=20
vertical-pad=15
inner-pad=10

# Geometry styling matching rounding from appearance.conf
radius=10
line-height=20
lines=10

[colors]
# Soft dark color palette (Background, text, borders, and selection)
background=1e1e2eff
text=cdd6f4ff
match=f38ba8ff
selection=313244ff
selection-text=cdd6f4ff
selection-match=f38ba8ff
border=33ccffff

[border]
width=1
radius=10
